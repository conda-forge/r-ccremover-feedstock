{% set version = "1.0.5" %}

{% set posix = 'm2-' if win else '' %}

package:
  name: r-ccremover
  version: {{ version|replace("-", "_") }}

source:
  url:
    - {{ cran_mirror }}/src/contrib/ccRemover_{{ version }}.tar.gz
    - {{ cran_mirror }}/src/contrib/Archive/ccRemover/ccRemover_{{ version }}.tar.gz
  sha256: cf0e01843aa8e8adef462abffbd84080fe78182ea0b3a9448c04a4f290a70d9f

build:
  number: 0
  noarch: generic
  rpaths:
    - lib/R/lib/
    - lib/

requirements:
  build:
    - {{ posix }}zip               # [win]
    - cross-r-base {{ r_base }}    # [build_platform != target_platform]
  host:
    - r-base
  run:
    - r-base

test:
  commands:
    - $R -e "library('ccRemover')"           # [not win]
    - "\"%R%\" -e \"library('ccRemover')\""  # [win]

about:
  home: https://CRAN.R-project.org/package=ccRemover
  license: GPL-3.0-only
  summary: Implements a method for identifying and removing the cell-cycle effect from scRNA-Seq data. The description of the  method is in Barron M. and Li J. (2016) <doi
  license_family: GPL3
  license_file: '{{ environ["PREFIX"] }}/lib/R/share/licenses/GPL-3'

extra:
  recipe-maintainers:
    - conda-forge/r
